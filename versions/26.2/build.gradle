plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "kingdom_come_combat-${project.minecraft_version}"
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "kingdom_come_combat" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    main {
        java.srcDir rootProject.file("../../src/main/java")
        resources.srcDir rootProject.file("../../src/main/resources")
    }
    client {
        java.srcDir rootProject.file("../../src/client/java")
        resources.srcDir rootProject.file("../../src/client/resources")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "org.javassist:javassist:3.30.2-GA"

    // The bundled 1.21.x mod jars use intermediary mappings and cannot be
    // loaded by the unobfuscated 26.2 toolchain. Add their 26.2 builds here
    // as they become available.
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
    withSourcesJar()
}
