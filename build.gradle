processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "minecraft_dependency", minecraftDependency
	inputs.property "cloth_dependency", targetClothConfig

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_dependency": minecraftDependency, "cloth_dependency": targetClothConfig
	}
	if (needs12111Apis) {
		filesMatching("kingdom_come_combat.mixins.json") {
			filter { String line -> line.contains('"LivingEntityProjectileArmorMixin",')
					? line + '\n\t\t"SpearKineticDamageMixin",'
					: line }
		}
		filesMatching("kingdom_come_combat.client.mixins.json") {
			filter { String line -> line.contains('"MinecraftClientTridentUseMixin",')
					? line + '\n\t\t"SpearAttackPoseMixin",'
					: line }
		}
	}
	if (needsLegacyRenderStates) {
		// 1.21.1 element rotations are restricted to 22.5-degree steps. Preserve
		// the newer models and only approximate their unsupported angles in this
		// target's processed resource output.
		filesMatching("assets/kingdom_come_combat/models/item/bullet_with_gunpowder.json") {
			filter { String line -> line
					.replace('"angle": -15', '"angle": -22.5')
					.replace('"angle": 15', '"angle": 22.5') }
		}
		filesMatching("assets/kingdom_come_combat/models/item/poleaxe.json") {
			filter { String line -> line
					.replace('"angle": -20', '"angle": -22.5')
					.replace('"angle": 20', '"angle": 22.5') }
		}
		filesMatching("data/kingdom_come_combat/enchantment/cushioning.json") {
			filter { String line -> line.replace("minecraft:armor_toughness", "minecraft:generic.armor_toughness") }
		}
		filesMatching("kingdom_come_combat.mixins.json") {
			filter { String line -> line.contains('"MilkBucketInjuryMixin"')
					? line.replace('"MilkBucketInjuryMixin"', '"LegacyMilkBucketInjuryMixin"')
					: line }
		}
		filesMatching("kingdom_come_combat.client.mixins.json") {
			filter { String line -> legacyClientMixinJsonLine(line) }
		}
	}
	doLast {
		if (!needsLegacyRenderStates) return
		// Newer item-definition JSON aliases both special cartridges to the base
		// model. 1.21.1 predates that format, so emit equivalent legacy model
		// aliases into this target only.
		["heavy_bullet_with_gunpowder", "buckshot_with_gunpowder"].each { ammoModel ->
			File legacyModel = new File(destinationDir,
					"assets/kingdom_come_combat/models/item/${ammoModel}.json")
			legacyModel.parentFile.mkdirs()
			legacyModel.setText('''{
  "parent": "kingdom_come_combat:item/bullet_with_gunpowder"
}
''', "UTF-8")
		}
		def ingredientObject = { Object ingredient ->
			if (!(ingredient instanceof String)) return ingredient
			return ingredient.startsWith("#")
					? [tag: ingredient.substring(1)]
					: [item: ingredient]
		}
		fileTree(destinationDir) {
			include "data/kingdom_come_combat/recipe/*.json"
		}.each { File recipeFile ->
			def recipe = new groovy.json.JsonSlurper().parse(recipeFile)
			if (recipe.key instanceof Map) {
				recipe.key.replaceAll { key, value -> ingredientObject(value) }
			}
			if (recipe.ingredients instanceof List) {
				recipe.ingredients = recipe.ingredients.collect { ingredientObject(it) }
			}
			["template", "base", "addition"].each { field ->
				if (recipe[field] instanceof String) recipe[field] = ingredientObject(recipe[field])
			}
			recipeFile.setText(groovy.json.JsonOutput.prettyPrint(
					groovy.json.JsonOutput.toJson(recipe)) + "\n", "UTF-8")
		}
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = providers.gradleProperty("modrinth_project_id")
			.orElse(providers.environmentVariable("MODRINTH_PROJECT_ID"))
			.orElse("")
			.get()
	versionNumber = "${project.version}+mc${targetMinecraft}"
	versionName = "Kingdom Come Combat ${project.version} for Minecraft ${targetMinecraft}"
	versionType = providers.gradleProperty("modrinth_version_type")
			.orElse(providers.environmentVariable("MODRINTH_VERSION_TYPE"))
			.orElse("release")
			.get()
	changelog = providers.gradleProperty("modrinth_changelog")
			.orElse(providers.environmentVariable("MODRINTH_CHANGELOG"))
			.orElse("Kingdom Come Combat ${project.version} for Minecraft ${targetMinecraft}.")
			.get()
	uploadFile = remapJar
	additionalFiles = [remapSourcesJar]
	gameVersions = [targetMinecraft]
	loaders = ["fabric"]
	debugMode = providers.gradleProperty("modrinth_debug")
			.orElse(providers.environmentVariable("MODRINTH_DEBUG"))
			.map { it.toBoolean() }
			.orElse(false)
