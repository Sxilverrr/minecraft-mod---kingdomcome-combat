            ItemStack stack, LivingEntity entity, ItemStack originalStack,
            ItemDisplayContext displayContext, MatrixStack matrices,
            OrderedRenderCommandQueue queue, int light
    ) {
        return kingdomcomecombat$renderedStack(stack, displayContext);
