tasks.named("modrinth") {
	dependsOn "remapJar", "remapSourcesJar"
	onlyIf {
		if (!System.getenv("MODRINTH_TOKEN")) {
			logger.lifecycle("Skipping Modrinth upload because MODRINTH_TOKEN is not set.")
			return false
		}
		if (!providers.gradleProperty("modrinth_project_id")
				.orElse(providers.environmentVariable("MODRINTH_PROJECT_ID"))
				.isPresent()) {
			logger.lifecycle("Skipping Modrinth upload because MODRINTH_PROJECT_ID or -Pmodrinth_project_id is not set.")
			return false
		}
		return true
	}
}

tasks.named("processClientResources").configure {
	// Client resources are target-specific too: 1.21.1 rewrites the mixin list
	// to legacy renderer hooks. Track the target so a later 1.21.7+ run cannot
	// reuse that filtered output from Gradle's task cache.
	inputs.property "target_minecraft", targetMinecraft
	if (needs12111Apis) {
		filesMatching("kingdom_come_combat.client.mixins.json") {
			filter { String line -> line.contains('"MinecraftClientTridentUseMixin",')
					? line + '\n\t\t"SpearAttackPoseMixin",'
					: line }
		}
	}
	if (needsCommandRendererApis) {
		// This is a Blockbench item model accidentally stored beside PAL animation
		// files. PAL 1.1.7 scans every JSON in this directory and rejects it.
		exclude "assets/kingdom_come_combat/player_animations/longsword.json"
		filesMatching("kingdom_come_combat.client.mixins.json") {
			filter { String line ->
				if (line.contains('"LivingEntityRendererCollisionOnlyOutputMixin"')) {
					return null
				}
				if (line.contains('"PalFirstPersonModeMixin",')) {
					return line + '\n\t\t"Pal12111FirstPersonPassMixin",'
				}
				if (line.contains('"LivingEntityRendererGenericFeedbackMixin",')) {
					return [
							line,
							'\t\t"ModelCommandRendererFinalHurtboxMixin",',
							'\t\t"LivingEntityRendererCollisionOnlyCommandMixin",',
							'\t\t"ModelCommandCollisionOnlyMarkerMixin",'
					].join('\n')
				}
				return line
			}
		}
	}
	if (needsLegacyRenderStates) {
		// PAL 1.1.4 also scans every JSON in this directory. This file is a
		// Blockbench item model, not a player animation.
		exclude "assets/kingdom_come_combat/player_animations/longsword.json"
		filesMatching("kingdom_come_combat.client.mixins.json") {
			filter { String line -> legacyClientMixinJsonLine(line) }
		}
	}
}

String legacyClientMixinJsonLine(String line) {
	if (line.contains('"PlayerEntityRendererBodyYawMixin"')) {
		return line.replace('"PlayerEntityRendererBodyYawMixin"', '"LegacyPlayerEntityRendererBodyYawMixin"')
	}
	if (line.contains('"LivingEntityRendererBloodiedTextureMixin"')) {
		return line.replace('"LivingEntityRendererBloodiedTextureMixin"', '"LegacyLivingEntityRendererBloodiedTextureMixin"')
	}
	if (line.contains('"EquipmentRendererBloodiedTextureMixin"')) {
		return line.replace('"EquipmentRendererBloodiedTextureMixin"', '"LegacyArmorFeatureRendererBloodiedTextureMixin"')
	}
	if (line.contains('"ItemRendererEquipmentOverlayMixin"')) {
		return line.replace('"ItemRendererEquipmentOverlayMixin"', '"LegacyItemRendererBloodiedTextureMixin"')
	}
	if (line.contains('"IllagerEntityRendererArmorMixin"')) {
		return line.replace('"IllagerEntityRendererArmorMixin"', '"LegacyIllagerEntityRendererArmorMixin"')
	}
	if (line.contains('"LivingEntityRendererFirstPersonBodyMixin"')) {
		return line.replace('"LivingEntityRendererFirstPersonBodyMixin"', '"LegacyLivingEntityRendererFirstPersonMixin"')
	}
	if (line.contains('"ArmorFeatureRendererFirstPersonBodyMixin"')) {
		return line.replace('"ArmorFeatureRendererFirstPersonBodyMixin"', '"LegacyArmorFeatureRendererFirstPersonBodyMixin"')
	}
	if (line.contains('"ModelFirstPersonHeadEquipmentMixin"')) {
		return line.replace('"ModelFirstPersonHeadEquipmentMixin"', '"LegacyAnimalModelFirstPersonHeadEquipmentMixin"')
	}
	if (line.contains('"LivingEntityRendererMobPalBodyMixin"')) {
		return line.replace('"LivingEntityRendererMobPalBodyMixin"', '"LegacyLivingEntityRendererMobPalBodyMixin"')
	}
	if (line.contains('"HeldItemFeatureRendererItemBoneMixin"')) {
		return line.replace('"HeldItemFeatureRendererItemBoneMixin"', '"LegacyHeldItemFeatureRendererItemBoneMixin",\n\t\t"LegacyHeldItemRendererHitboxMixin"')
	}
	if (line.contains('"LivingEntityRendererFirstPersonBridgeMixin"')) {
		return null
	}
	if (line.contains('"LivingEntityRendererGenericFeedbackMixin"')) {
		return line.replace('"LivingEntityRendererGenericFeedbackMixin"', '"LegacyLivingEntityRendererGenericFeedbackMixin"')
	}
	if (line.contains('"LivingEntityRendererCollisionOnlyOutputMixin"')) {
		return line.replace('"LivingEntityRendererCollisionOnlyOutputMixin"', '"LegacyLivingEntityRendererCollisionOnlyOutputMixin"')
	}
	if (line.contains('"WorldRendererFirstPersonCollisionMixin"')) {
		return line.replace('"WorldRendererFirstPersonCollisionMixin"', '"LegacyWorldRendererFirstPersonCollisionMixin"')
	}
	if (line.contains('"BipedEntityModelHitReactionMixin"')) {
		return line.replace('"BipedEntityModelHitReactionMixin"',
				'"LegacyBipedEntityModelHurtboxMixin",\n\t\t"LegacyPlayerEntityModelPalHurtboxMixin"')
	}
	if (line.contains('"SkeletonEntityModelAnimationMixin"')) {
		return line.replace('"SkeletonEntityModelAnimationMixin"', '"LegacySkeletonEntityModelAnimationMixin"')
	}
	if (line.contains('"ZombieEntityModelAnimationMixin"')) {
		return line.replace('"ZombieEntityModelAnimationMixin",', '"LegacyZombieEntityModelAnimationMixin"')
	}
	if (line.contains('"PiglinEntityModelAnimationMixin"')) {
		return line.replace('"PiglinEntityModelAnimationMixin"', '"LegacyPiglinEntityModelAnimationMixin"')
	}
	if (line.contains('"IllagerEntityModelAnimationMixin"')) {
		return line.replace('"IllagerEntityModelAnimationMixin"', '"LegacyIllagerEntityModelAnimationMixin"')
	}
	def unsupported = [
			"ArmorFeatureRendererEquipmentOverlayMixin", "ArmorFeatureRendererFirstPersonBodyMixin",
			"ArmedEntityRenderStateHandCannonMixin", "BowUseDurationPropertyMixin",
			"EntityRenderStateMixin",
			"EquipmentRendererBloodiedTextureMixin", "EntityRenderDispatcherPalCompatMixin",
			"LivingEntityRendererBandageHeadMixin", "LivingEntityRendererBloodiedTextureMixin",
			"LivingEntityRendererFirstPersonBridgeMixin", "LivingEntityRendererStateMixin",
		"PlayerEntityRendererBodyYawMixin",
		"PlayerEntityModelPalHurtboxMixin",
			"LivingEntityRendererFirstPersonBodyMixin", "PiglinEntityModelAnimationMixin",
			"ModelFirstPersonHeadEquipmentMixin",
			"PlayerInventoryAttackLockMixin",
			"HeldItemRendererItemBoneMixin",
			"ItemRendererEquipmentOverlayMixin", "IllagerEntityRendererArmorMixin",
			"ItemRenderStateKccAccess", "ItemRenderStateLayerRenderStateMixin",
			"IllagerEntityModelAnimationMixin", "SkeletonEntityModelAnimationMixin",
			"ZombieEntityModelAnimationMixin", "ZombieVillagerEntityModelAnimationMixin",
			"ZombifiedPiglinEntityModelAnimationMixin"
	]
	if (unsupported.any { line.contains('"' + it + '"') }) {
		return null
	}
	return line
}

tasks.register("printCompatibilityTarget") {
	doLast {
		println "Minecraft: ${targetMinecraft}"
		println "Yarn: ${targetYarnMappings}"
		println "Fabric API: ${targetFabricApi}"
		println "Metadata dependency: ${minecraftDependency}"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

