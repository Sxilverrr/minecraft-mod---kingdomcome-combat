String kingdomComeCombatTransform1219(String line, boolean needs12111Apis) {
	String transformed = line
			.replace("net.minecraft.world.BlockView", "net.minecraft.world.World")
			.replace("BlockView area", "World area")
			.replace(".getWorld()", ".getEntityWorld()")
			.replace("context.getEntityWorld()", "context.getWorld()")
			.replace(".getPos()", ".getEntityPos()")
			.replace("blockHit.getEntityPos()", "blockHit.getPos()")
			.replace("hit.getEntityPos()", "hit.getPos()")
			.replace("vanillaHit.getEntityPos()", "vanillaHit.getPos()")
			.replace("import net.minecraft.particle.ParticleTypes;", "import net.minecraft.particle.ParticleTypes;\nimport net.minecraft.particle.DragonBreathParticleEffect;\nimport net.minecraft.particle.TintedParticleEffect;")
			.replace("ParticleTypes.DRAGON_BREATH", "DragonBreathParticleEffect.of(ParticleTypes.DRAGON_BREATH, 1.0F)")
			.replace("ParticleTypes.FLASH", "TintedParticleEffect.create(ParticleTypes.FLASH, 0xFFFFFFFF)")
			.replace("player.getServer()", "player.getEntityWorld().getServer()")
			.replaceAll(/\.isClient(?!\s*\()/, ".isClient()")
	if (needs12111Apis) {
		transformed = transformed
				// 1.21.11 renamed the network velocity-update flag to knockedBack.
				// velocityDirty still exists, but is a different physics bookkeeping flag.
				.replace(".velocityModified = true;", ".knockedBack = true;")
				.replace("context.player().hasPermissionLevel(2)", "context.player().getCommandSource((net.minecraft.server.world.ServerWorld) context.player().getEntityWorld()).getPermissions().hasPermission(new net.minecraft.command.permission.Permission.Level(net.minecraft.command.permission.PermissionLevel.GAMEMASTERS))")
				.replace("player.hasPermissionLevel(2)", "((player.getEntityWorld().getServer() != null && player.getEntityWorld().getServer().isHost(new net.minecraft.server.PlayerConfigEntry(player.getGameProfile()))) || player.getCommandSource((net.minecraft.server.world.ServerWorld) player.getEntityWorld()).getPermissions().hasPermission(new net.minecraft.command.permission.Permission.Level(net.minecraft.command.permission.PermissionLevel.GAMEMASTERS)))")
				.replace("source.hasPermissionLevel(2)", "source.getPermissions().hasPermission(new net.minecraft.command.permission.Permission.Level(net.minecraft.command.permission.PermissionLevel.GAMEMASTERS))")
				.replace("factories.add((entity, random) ->", "factories.add((world, entity, random) ->")
				.replace("player.getEntityWorld().getServer() != null && player.getEntityWorld().getServer().isPvpEnabled()", "player.getEntityWorld().getGameRules().getValue(net.minecraft.world.rule.GameRules.PVP)")
				.replace("player.getEntityWorld().getServer().isPvpEnabled()", "player.getEntityWorld().getGameRules().getValue(net.minecraft.world.rule.GameRules.PVP)")
	}
	return transformed
}

