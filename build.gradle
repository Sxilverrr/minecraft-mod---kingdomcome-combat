plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'com.modrinth.minotaur' version '2.+'
	id 'maven-publish'
}

def compatibilityMatrix = [
		"1.21"   : [yarn: "1.21+build.9",    api: "0.102.0+1.21"],
		"1.21.1" : [yarn: "1.21.1+build.3",  api: "0.116.12+1.21.1"],
		"1.21.2" : [yarn: "1.21.2+build.1",  api: "0.106.1+1.21.2"],
		"1.21.3" : [yarn: "1.21.3+build.2",  api: "0.114.1+1.21.3"],
		"1.21.4" : [yarn: "1.21.4+build.8",  api: "0.119.3+1.21.4"],
		"1.21.5" : [yarn: "1.21.5+build.1",  api: "0.128.2+1.21.5"],
		"1.21.6" : [yarn: "1.21.6+build.1",  api: "0.128.2+1.21.6"],
		"1.21.7" : [yarn: "1.21.7+build.8",  api: "0.129.0+1.21.7"],
		"1.21.8" : [yarn: "1.21.8+build.1",  api: "0.136.1+1.21.8"],
		"1.21.9" : [yarn: "1.21.9+build.1",  api: "0.134.1+1.21.9"],
		"1.21.10": [yarn: "1.21.10+build.3", api: "0.138.4+1.21.10"],
		"1.21.11": [yarn: "1.21.11+build.6", api: "0.141.4+1.21.11"]
]
def targetMinecraft = providers.gradleProperty("target_mc").orElse(minecraft_version).get()
def targetVersions = compatibilityMatrix[targetMinecraft]
if (targetVersions == null) {
	throw new GradleException("Unsupported target_mc '${targetMinecraft}'. Supported: ${compatibilityMatrix.keySet().join(', ')}")
}
def targetYarnMappings = providers.gradleProperty("target_mc").isPresent()
		? targetVersions.yarn
		: yarn_mappings
def targetFabricApi = providers.gradleProperty("target_mc").isPresent()
		? targetVersions.api
		: fabric_api_version
def targetClothConfig = targetMinecraft == "1.21.1"
		? "15.0.140"
		: (targetMinecraft == "1.21.11" ? "21.11.153" : "19.0.147")
def minecraftDependency = providers.gradleProperty("target_mc").isPresent()
		? "=${targetMinecraft}"
		: ">=1.21.7 <=1.21.8"

version = project.mod_version
group = project.maven_group


repositories {
	mavenCentral()
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
	maven {
		name = "CurseMaven"
		url = "https://cursemaven.com"
	}
}
loom {
	splitEnvironmentSourceSets()

	mods {
		"kingdom_come_combat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		configureEach {
			if (name.toLowerCase().contains("client")
					&& System.getProperty("os.name").toLowerCase().contains("mac")) {
				vmArg "-XstartOnFirstThread"
			}
		}
		client {
			// Runtime mods and configs are not binary-compatible across the 1.21.x
			// renderer transitions. Keep every non-default target isolated.
			runDir targetMinecraft == minecraft_version ? "run" : "run-${targetMinecraft}"
		}
		server {
			// Dedicated-server validation must not load renderer-specific jars from
			// the default development run directory.
			runDir "run-server-${targetMinecraft}"
		}
	}
}

def minecraftVersionOrder = compatibilityMatrix.keySet().toList()
def targetVersionIndex = minecraftVersionOrder.indexOf(targetMinecraft)
def itemApi1215Index = minecraftVersionOrder.indexOf("1.21.5")
def renderStateIntroductionIndex = minecraftVersionOrder.indexOf("1.21.2")
def storageViewIntroductionIndex = minecraftVersionOrder.indexOf("1.21.6")
def entityAccessorRenameIndex = minecraftVersionOrder.indexOf("1.21.9")
def needsLegacyNbt = targetVersionIndex < storageViewIntroductionIndex
def needsPre1215Apis = targetVersionIndex < itemApi1215Index
def needsLegacyRenderStates = targetVersionIndex < renderStateIntroductionIndex
def needsNewEntityAccessors = targetVersionIndex >= entityAccessorRenameIndex
def needs12111Apis = targetMinecraft == "1.21.11"
def needsCommandRendererApis = targetVersionIndex >= minecraftVersionOrder.indexOf("1.21.10")

if (providers.gradleProperty("target_mc").isPresent() && (needsLegacyNbt || needsNewEntityAccessors)) {
	def generatedMain = layout.buildDirectory.dir("generated/versionCompat/main")
	def generatedClient = layout.buildDirectory.dir("generated/versionCompat/client")

	tasks.register("generateVersionCompatSources") {
		inputs.files(fileTree("src/main/java"), fileTree("src/client/java"))
		// The generated tree depends on the selected Minecraft API surface. Without
		// these scalar inputs Gradle can reuse (for example) 1.21.11 sources for a
		// subsequent 1.21.1 build because the source files themselves did not change.
		inputs.property("targetMinecraft", targetMinecraft)
		inputs.property("needsLegacyNbt", needsLegacyNbt)
		inputs.property("needsPre1215Apis", needsPre1215Apis)
		inputs.property("needsLegacyRenderStates", needsLegacyRenderStates)
		inputs.property("needsNewEntityAccessors", needsNewEntityAccessors)
		inputs.property("needs12111Apis", needs12111Apis)
		inputs.property("needsCommandRendererApis", needsCommandRendererApis)
		outputs.dirs(generatedMain, generatedClient)
			doLast {
			delete generatedMain, generatedClient
			def skippingLegacyLootMethod = false
			copy {
				from "src/main/java"
				if (needsPre1215Apis) {
					exclude "com/kingdomcomecombat/mixin/MilkBucketInjuryMixin.java"
				}
				if (needs12111Apis) {
					exclude "com/kingdomcomecombat/game/ModGameRules.java"
				}
				if (needsLegacyRenderStates) {
				}
				into generatedMain
				filter { String line ->
					if (needsLegacyNbt && line.contains("private static void registerLoot()")) {
						skippingLegacyLootMethod = true
						return "    private static void registerLoot() {\n    }"
					}
					if (skippingLegacyLootMethod && line.contains("private static void registerTrades()")) {
						skippingLegacyLootMethod = false
						return line
					}
					if (skippingLegacyLootMethod) {
						return null
					}
					return needsLegacyNbt
							? kingdomComeCombatTransformLegacy121(line, needsPre1215Apis)
							: kingdomComeCombatTransform1219(line, needs12111Apis)
				}
			}
			if (needsPre1215Apis) {
				copy {
					from "src/compat/legacy/main"
					into generatedMain
				}
			}
			copy {
				from "src/client/java"
				if (needsCommandRendererApis) {
					exclude "com/kingdomcomecombat/mixin/client/LivingEntityRendererMobPalBodyMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/LivingEntityRendererCollisionOnlyOutputMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/WorldRendererFirstPersonCollisionMixin.java"
				}
				if (needsLegacyNbt) {
					exclude "com/kingdomcomecombat/client/collision/ClientGenericModelTracker.java"
				}
				if (needsLegacyRenderStates) {
					exclude "com/kingdomcomecombat/client/animation/MobPalBodyTransformApplier.java"
					exclude "com/kingdomcomecombat/client/animation/ItemBoneTransformApplier.java"
					exclude "com/kingdomcomecombat/client/animation/MobStanceHeadTargeting.java"
					exclude "com/kingdomcomecombat/client/animation/VanillaSkeletonGeckoAnimationApplier.java"
					exclude "com/kingdomcomecombat/client/render/EquipmentOverlayRenderer.java"
					exclude "com/kingdomcomecombat/client/render/HandCannonBulletRenderer.java"
					exclude "com/kingdomcomecombat/client/render/IllagerArmorFeatureRenderer.java"
					exclude "com/kingdomcomecombat/mixin/client/ArmorFeatureRendererEquipmentOverlayMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/ArmorFeatureRendererFirstPersonBodyMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/ArmedEntityRenderStateHandCannonMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/BipedEntityModelHitReactionMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/BowUseDurationPropertyMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/EntityRenderDispatcherPalCompatMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/EntityRenderStateMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/EquipmentRendererBloodiedTextureMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/HeldItemFeatureRendererItemBoneMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/HeldItemRendererItemBoneMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/IllagerEntityModelAnimationMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/IllagerEntityRendererArmorMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/ItemRenderStateKccAccess.java"
					exclude "com/kingdomcomecombat/mixin/client/ItemRenderStateLayerRenderStateMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/ItemRendererEquipmentOverlayMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/LivingEntityRendererBandageHeadMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/LivingEntityRendererBloodiedTextureMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/LivingEntityRendererFirstPersonBodyMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/LivingEntityRendererFirstPersonBridgeMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/LivingEntityRendererGenericFeedbackMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/LivingEntityRendererMobPalBodyMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/LivingEntityRendererStateMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/PiglinEntityModelAnimationMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/PlayerEntityRendererBodyYawMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/PlayerEntityModelPalHurtboxMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/LivingEntityRendererCollisionOnlyOutputMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/WorldRendererFirstPersonCollisionMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/PlayerInventoryAttackLockMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/SkeletonEntityModelAnimationMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/ZombieEntityModelAnimationMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/ZombieVillagerEntityModelAnimationMixin.java"
					exclude "com/kingdomcomecombat/mixin/client/ZombifiedPiglinEntityModelAnimationMixin.java"
				}
				into generatedClient
				filter { String line -> needsLegacyNbt
						? kingdomComeCombatTransformLegacy121(line, needsPre1215Apis)
						: kingdomComeCombatTransform1219(line, needs12111Apis) }
			}
			if (needsPre1215Apis) {
				patchLegacy1211Sources(generatedMain.get().asFile)
				patchLegacy1211ClientSources(generatedClient.get().asFile)
			}
			if (targetMinecraft == "1.21") {
				File hardshipEffects = new File(generatedMain.get().asFile,
						"com/kingdomcomecombat/hardship/HardshipEffects.java")
				if (hardshipEffects.exists()) {
					hardshipEffects.setText(hardshipEffects.getText("UTF-8").replace(
							"        ServerLivingEntityEvents.AFTER_DAMAGE.register((entity, source, baseDamage, damage, blocked) -> {\n            onPlayerDamaged(entity, damage);\n        });",
							"        ServerLivingEntityEvents.ALLOW_DAMAGE.register((entity, source, damage) -> {\n            onPlayerDamaged(entity, damage);\n            return true;\n        });"
					), "UTF-8")
				}
			}
			if (needsCommandRendererApis) {
				patch12111ClientSources(generatedClient.get().asFile)
			}
			if (targetMinecraft == "1.21.10") {
				copy {
					from "src/compat/12111/client"
					exclude "com/kingdomcomecombat/mixin/client/SpearAttackPoseMixin.java"
					into generatedClient
				}
				patch12110ClientSources(generatedClient.get().asFile)
			}
			if (needs12111Apis) {
				File playerAttack = new File(generatedMain.get().asFile, "com/kingdomcomecombat/mixin/PlayerEntityVanillaAttackMixin.java")
				if (playerAttack.exists()) {
					playerAttack.setText(playerAttack.getText("UTF-8").replace(
							"    @WrapOperation(\n            method = \"attack\",\n            at = @At(value = \"INVOKE\", target = \"Lnet/minecraft/entity/player/PlayerEntity;isOnGround()Z\")\n    )",
							"    @WrapOperation(\n            method = \"canUseSweepAttack\",\n            at = @At(value = \"INVOKE\", target = \"Lnet/minecraft/entity/player/PlayerEntity;isOnGround()Z\")\n    )"
					), "UTF-8")
				}
			}
		}
	}

	sourceSets.main.java.setSrcDirs(needs12111Apis
			? [generatedMain, file("src/compat/12111/java")]
			: [generatedMain])
	sourceSets.client.java.setSrcDirs(needsLegacyNbt
			? [generatedClient, file("src/compat/legacy/java")]
			: (needs12111Apis
				? [generatedClient, file("src/compat/12111/client")]
				: [generatedClient]))
	tasks.named("compileJava").configure { dependsOn "generateVersionCompatSources" }
	tasks.named("compileClientJava").configure { dependsOn "generateVersionCompatSources" }
	tasks.matching { it.name == "sourcesJar" }.configureEach {
		dependsOn "generateVersionCompatSources"
	}
}

String kingdomComeCombatTransformLegacy121(String line, boolean needsPre1215Apis) {
	String transformed = line
			.replace("import net.minecraft.storage.ReadView;", "import net.minecraft.nbt.NbtCompound;")
			.replace("import net.minecraft.storage.WriteView;", "import net.minecraft.nbt.NbtCompound;")
			.replace("ReadView", "NbtCompound")
			.replace("WriteView", "NbtCompound")
			.replace("readCustomData(", "readCustomDataFromNbt(")
			.replace("writeCustomData(", "writeCustomDataToNbt(")
			.replace('"readCustomData"', '"readCustomDataFromNbt"')
			.replace('"writeCustomData"', '"writeCustomDataToNbt"')
			.replace("import net.minecraft.client.gl.RenderPipelines;", "import net.minecraft.client.render.RenderLayer;")
			.replace("RenderPipelines.GUI_TEXTURED", "RenderLayer::getGuiTextured")
			.replace("        registerLoot();", "        // Loot injection requires Fabric's post-drop event (1.21.6+).")
	if (!needsPre1215Apis) {
		return transformed
	}

	transformed = transformed
			.replace("net.minecraft.item.consume.UseAction", "net.minecraft.util.UseAction")
			.replace("EntityAttributes.ARMOR_TOUGHNESS", "EntityAttributes.GENERIC_ARMOR_TOUGHNESS")
			.replace("EntityAttributes.ATTACK_DAMAGE", "EntityAttributes.GENERIC_ATTACK_DAMAGE")
			.replace("EntityAttributes.ATTACK_SPEED", "EntityAttributes.GENERIC_ATTACK_SPEED")
			.replace("EntityAttributes.MAX_HEALTH", "EntityAttributes.GENERIC_MAX_HEALTH")
			.replace("EntityAttributes.MOVEMENT_SPEED", "EntityAttributes.GENERIC_MOVEMENT_SPEED")
			.replace("EntityAttributes.JUMP_STRENGTH", "EntityAttributes.GENERIC_JUMP_STRENGTH")
			.replace("EntityAttributes.SCALE", "EntityAttributes.GENERIC_SCALE")
			.replace("EntityAttributes.SPAWN_REINFORCEMENTS", "EntityAttributes.ZOMBIE_SPAWN_REINFORCEMENTS")
			.replace("EntityAttributes.ARMOR", "EntityAttributes.GENERIC_ARMOR")
			.replace("EntityAttributes.ENTITY_INTERACTION_RANGE", "EntityAttributes.PLAYER_ENTITY_INTERACTION_RANGE")
			.replace("EntityAttributes.BLOCK_INTERACTION_RANGE", "EntityAttributes.PLAYER_BLOCK_INTERACTION_RANGE")
			.replace("EntityAttributes.BLOCK_BREAK_SPEED", "EntityAttributes.PLAYER_BLOCK_BREAK_SPEED")
			.replace("EntityAttributes.FOLLOW_RANGE", "EntityAttributes.GENERIC_FOLLOW_RANGE")
			.replace(".registryKey(key)", "")
			.replace(".enchantable(enchantability)", "")
			.replace("target.damage(world, ", "target.damage(")
			.replace("living.damage(world, ", "living.damage(")
			.replace("living.damage(\n", "living.damage(\n")
			.replace("target.damage((ServerWorld) this.getWorld(), ", "target.damage(")
			.replace("target.damage((ServerWorld) mob.getWorld(), ", "target.damage(")
			.replace("SoundEvents.ITEM_SHIELD_BLOCK.value()", "SoundEvents.ITEM_SHIELD_BLOCK")
			.replace(".enchantable(12)", "")
			.replace("Registries.ENTITY_TYPE.getOptionalValue(id)", "Registries.ENTITY_TYPE.getOrEmpty(id)")
			.replace("EntityPose.GLIDING", "EntityPose.FALL_FLYING")
			.replace('view.getString("ammo_type", HandCannonItem.AmmoType.NORMAL.name())', 'view.getString("ammo_type")')
			.replace('data.copyNbt().getString(AMMO_TYPE_KEY, AmmoType.NORMAL.name())', 'data.copyNbt().getString(AMMO_TYPE_KEY)')
			.replaceAll(/\.get(String|Double|Int|Boolean)\(([^,]+), [^()]+\)/, '.get$1($2)')
			.replace("StringArgumentType.getString(context)", "StringArgumentType.getString(context, \"combo\")")
			.replace("net.minecraft.item.ItemDisplayContext", "net.minecraft.client.render.model.json.ModelTransformationMode")
			.replace("ItemDisplayContext", "ModelTransformationMode")
			.replace('"displayContext"', '"modelTransformationMode"')
			.replace(".originX", ".pivotX")
			.replace(".originY", ".pivotY")
			.replace(".originZ", ".pivotZ")
			.replace("defaults.x()", "defaults.pivotX()")
			.replace("defaults.y()", "defaults.pivotY()")
			.replace("defaults.z()", "defaults.pivotZ()")
			.replace(".relativeHeadYaw", ".yawDegrees")
			.replace(".lastBodyYaw", ".prevBodyYaw")
			.replace(".getTickProgress(true)", ".getTickDelta(true)")
			.replace(".getTickProgress(false)", ".getTickDelta(false)")
			.replace(".isGliding()", ".isFallFlying()")
			.replace(".applyTransform(matrices)", ".rotate(matrices)")
			.replace(".getColorArgb(", ".getColor(")
			.replace(".setColorArgb(", ".setColor(")
			.replace("context.drawTexture(RenderLayer::getGuiTextured, ", "context.drawTexture(")
			.replace("quad.sprite()", "quad.getSprite()")
			.replace("quad.tintIndex()", "quad.getTintIndex()")
			.replace(".addParticleClient(", ".addParticle(")
			.replace("World;addParticleClient(", "World;addParticle(")
			.replace(
					"new Item.Settings().registryKey(key).armor(ArmorMaterials.IRON, EquipmentType.HELMET).maxDamage(198)",
					"ArmorMaterials.IRON.applySettings(new Item.Settings().registryKey(key), EquipmentType.HELMET).maxDamage(198)"
			)
			.replace(
					"public void inventoryTick(ItemStack stack, ServerWorld world, Entity entity, net.minecraft.entity.EquipmentSlot slot) {",
					"public void inventoryTick(ItemStack stack, World rawWorld, Entity entity, int slot, boolean selected) {\n        if (!(rawWorld instanceof ServerWorld world)) {\n            return;\n        }"
			)
			.replace(
					"effect -> target.addStatusEffect(effect.withScaledDuration(0.25F), attacker),",
					"effect -> target.addStatusEffect(new net.minecraft.entity.effect.StatusEffectInstance(effect.getEffectType(), Math.max(1, (int) (effect.getDuration() * 0.25F)), effect.getAmplifier(), effect.isAmbient(), effect.shouldShowParticles(), effect.shouldShowIcon()), attacker)"
			)
	if (transformed.trim() == "0.25F") {
		return null
	}
	if (transformed.trim() == "RenderLayer::getGuiTextured,") {
		return null
	}
	if (transformed.contains("() -> KingdomComeCombat.MOD_ID + \"/\" + dynamicId.getPath()")) {
		return null
	}
	return transformed
}

void patchLegacy1211Sources(File generatedMain) {
	File horseRiding = new File(generatedMain, "com/kingdomcomecombat/mixin/AbstractHorseEntityRidingMixin.java")
	if (horseRiding.exists()) {
		horseRiding.setText(horseRiding.getText("UTF-8")
				.replace("@Shadow public abstract void setAngry(int ticks);",
						"@Shadow public abstract void setAngry(boolean angry);")
				.replaceAll(/this\.setAngry\(\d+\)/, "this.setAngry(true)"), "UTF-8")
	}

	File instantHealth = new File(generatedMain, "com/kingdomcomecombat/mixin/InstantHealthClearsInjuryMixin.java")
	if (instantHealth.exists()) {
		instantHealth.setText(instantHealth.getText("UTF-8").replace(
				"            ServerWorld world,\n            Entity source,",
				"            Entity source,"
		), "UTF-8")
	}

	File dragonParry = new File(generatedMain, "com/kingdomcomecombat/mixin/DragonParryProtectionMixin.java")
	if (dragonParry.exists()) {
		dragonParry.setText(dragonParry.getText("UTF-8")
				.replace("            ServerWorld world, DamageSource source, float amount,",
						"            DamageSource source, float amount,")
				.replace("        if (EnderDragonBossHandler.tryLongHoldChargeCollisionBlock(\n                world, (LivingEntity) (Object) this, source.getAttacker())) {",
						"        LivingEntity self = (LivingEntity) (Object) this;\n        if (self.getWorld() instanceof ServerWorld world\n                && EnderDragonBossHandler.tryLongHoldChargeCollisionBlock(\n                world, self, source.getAttacker())) {"), "UTF-8")
	}

	File bloodSplash = new File(generatedMain, "com/kingdomcomecombat/mixin/LivingEntityBloodSplashMixin.java")
	if (bloodSplash.exists()) {
		bloodSplash.setText(bloodSplash.getText("UTF-8")
				.replace("            ServerWorld world,\n            DamageSource source,",
						"            DamageSource source,")
				.replace("        if (cir.getReturnValue()) {\n            BloodiedEquipment.splashBlood(\n                    world,",
						"        if (cir.getReturnValue() && ((LivingEntity) (Object) this).getWorld() instanceof ServerWorld world) {\n            BloodiedEquipment.splashBlood(\n                    world,"), "UTF-8")
	}

	File projectileArmor = new File(generatedMain, "com/kingdomcomecombat/mixin/LivingEntityProjectileArmorMixin.java")
	if (projectileArmor.exists()) {
		projectileArmor.setText(projectileArmor.getText("UTF-8")
				.replace("    private void kingdomcomecombat\$applyProjectileArmor(\n            ServerWorld world,\n            DamageSource source,",
						"    private void kingdomcomecombat\$applyProjectileArmor(\n            DamageSource source,")
				.replace("    private void kingdomcomecombat\$applyEnvironmentalInjury(\n            ServerWorld world,\n            DamageSource source,",
						"    private void kingdomcomecombat\$applyEnvironmentalInjury(\n            DamageSource source,")
				.replace("        LivingEntity target = (LivingEntity) (Object) this;\n        if (source.isOf(KCC_BLEEDING_DAMAGE)) {",
						"        LivingEntity target = (LivingEntity) (Object) this;\n        if (!(target.getWorld() instanceof ServerWorld world)) return;\n        if (source.isOf(KCC_BLEEDING_DAMAGE)) {"), "UTF-8")
	}

	File passiveDamage = new File(generatedMain, "com/kingdomcomecombat/mixin/LivingEntityPassiveDamageDebuffMixin.java")
	if (passiveDamage.exists()) {
		passiveDamage.setText(passiveDamage.getText("UTF-8").replace(
				"            float amount,\n            ServerWorld world,\n            DamageSource source\n    ) {",
				"            float amount,\n            DamageSource source,\n            float originalAmount\n    ) {"
		), "UTF-8")
	}

	File mobAttack = new File(generatedMain, "com/kingdomcomecombat/mixin/MobEntityVanillaAttackMixin.java")
	if (mobAttack.exists()) {
		mobAttack.setText(mobAttack.getText("UTF-8").replace(
				"            ServerWorld world,\n            Entity target,",
				"            Entity target,"
		), "UTF-8")
	}

	File ironGolemAttack = new File(generatedMain, "com/kingdomcomecombat/mixin/IronGolemEntityVanillaAttackMixin.java")
	if (ironGolemAttack.exists()) {
		ironGolemAttack.setText(ironGolemAttack.getText("UTF-8")
				.replaceAll('(?m)^\\s*ServerWorld world,\\s*', '')
				.replace("import net.minecraft.server.world.ServerWorld;\n", ""), "UTF-8")
	}

	File projectileTrail = new File(generatedMain, "com/kingdomcomecombat/mixin/PersistentProjectileDragonBreathTrailMixin.java")
	if (projectileTrail.exists()) {
		projectileTrail.setText(projectileTrail.getText("UTF-8")
				.replace("    protected abstract boolean isInGround();", "    protected boolean inGround;")
