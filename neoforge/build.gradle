tasks.named('compileJava').configure {
    dependsOn 'patchMigratedNeoSources'
    exclude 'com/kingdomcomecombat/client/config/KccModMenuIntegration.java'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    exclude 'assets/kingdom_come_combat/textures/item/老式全身板甲.png'
    exclude 'assets/kingdom_come_combat/models/item/老式全身板甲.json'
    exclude 'assets/kingdom_come_combat/models/item/十字军.geo.json'
    exclude 'assets/kingdom_come_combat/player_animations/longsword.json'
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version,
                minecraft_version: minecraft_version,
                neoforge_version: neoforge_version,
                cloth_config_version: cloth_config_version,
                pal_version: pal_version
    }
    filesMatching('kingdom_come_combat.mixins.json') {
        filter { String line -> (line.contains('"AbstractHorseEntityRidingMixin"')
                || line.contains('"MilkBucketInjuryMixin"')) ? null : line }
    }
    filesMatching('kingdom_come_combat.client.mixins.json') {
        def unsupported1211 = [
                'ArmorFeatureRendererEquipmentOverlayMixin', 'ArmorFeatureRendererFirstPersonBodyMixin',
                'ArmedEntityRenderStateHandCannonMixin', 'BowUseDurationPropertyMixin',
                'BipedEntityModelHitReactionMixin', 'EntityRenderStateMixin',
                'EquipmentRendererBloodiedTextureMixin', 'EntityRenderDispatcherPalCompatMixin',
                'LivingEntityRendererBandageHeadMixin', 'LivingEntityRendererBloodiedTextureMixin',
                'LivingEntityRendererFirstPersonBridgeMixin', 'LivingEntityRendererStateMixin',
                'LivingEntityRendererGenericFeedbackMixin', 'PlayerEntityRendererBodyYawMixin',
                'LivingEntityRendererMobPalBodyMixin', 'LivingEntityRendererCollisionOnlyOutputMixin',
                'WorldRendererFirstPersonCollisionMixin', 'PlayerEntityModelPalHurtboxMixin',
                'LivingEntityRendererFirstPersonBodyMixin', 'PlayerInventoryAttackLockMixin',
                'ModelFirstPersonHeadEquipmentMixin',
                'PiglinEntityModelAnimationMixin', 'HeldItemRendererItemBoneMixin',
                'HeldItemFeatureRendererItemBoneMixin', 'ItemRendererEquipmentOverlayMixin',
                'IllagerEntityRendererArmorMixin', 'ItemRenderStateKccAccess',
                'ItemRenderStateLayerRenderStateMixin', 'IllagerEntityModelAnimationMixin',
                'SkeletonEntityModelAnimationMixin', 'ZombieEntityModelAnimationMixin',
                'ZombieVillagerEntityModelAnimationMixin', 'ZombifiedPiglinEntityModelAnimationMixin'
        ]
        filter { String line -> unsupported1211.any { line.contains('"' + it + '"') } ? null : line }
    }
    doLast {
        File commonMixins = file("${destinationDir}/kingdom_come_combat.mixins.json")
        if (commonMixins.exists()) {
            commonMixins.setText(commonMixins.readLines('UTF-8').findAll { line ->
                !line.contains('"AbstractHorseEntityRidingMixin"') &&
                        !line.contains('"MilkBucketInjuryMixin"')
            }.join('\n') + '\n', 'UTF-8')
        }
        File clientMixins = file("${destinationDir}/kingdom_come_combat.client.mixins.json")
        if (clientMixins.exists()) {
            def unsupported = [
                    'ArmorFeatureRendererEquipmentOverlayMixin', 'ArmorFeatureRendererFirstPersonBodyMixin',
                    'ArmedEntityRenderStateHandCannonMixin', 'BowUseDurationPropertyMixin',
                    'BipedEntityModelHitReactionMixin', 'EntityRenderStateMixin',
                    'EquipmentRendererBloodiedTextureMixin', 'EntityRenderDispatcherPalCompatMixin',
                    'LivingEntityRendererBandageHeadMixin', 'LivingEntityRendererBloodiedTextureMixin',
                    'LivingEntityRendererFirstPersonBridgeMixin', 'LivingEntityRendererStateMixin',
                    'LivingEntityRendererGenericFeedbackMixin', 'PlayerEntityRendererBodyYawMixin',
                    'LivingEntityRendererMobPalBodyMixin', 'LivingEntityRendererCollisionOnlyOutputMixin',
                    'WorldRendererFirstPersonCollisionMixin', 'PlayerEntityModelPalHurtboxMixin',
                    'LivingEntityRendererFirstPersonBodyMixin', 'PlayerInventoryAttackLockMixin',
                    'ModelFirstPersonHeadEquipmentMixin',
                    'PiglinEntityModelAnimationMixin', 'HeldItemRendererItemBoneMixin',
                    'HeldItemFeatureRendererItemBoneMixin', 'ItemRendererEquipmentOverlayMixin',
                    'IllagerEntityRendererArmorMixin', 'ItemRenderStateKccAccess',
                    'ItemRenderStateLayerRenderStateMixin', 'IllagerEntityModelAnimationMixin',
                    'SkeletonEntityModelAnimationMixin', 'ZombieEntityModelAnimationMixin',
                    'ZombieVillagerEntityModelAnimationMixin', 'ZombifiedPiglinEntityModelAnimationMixin'
            ]
            String filteredClientMixins = clientMixins.readLines('UTF-8').findAll { line ->
                !unsupported.any { line.contains('"' + it + '"') }
            }.join('\n') + '\n'
            filteredClientMixins = filteredClientMixins.replace(
                    '\t\t"ClientPlayerInteractionManagerMixin",',
					'''\t\t"LegacyZombieEntityModelAnimationMixin",
\t\t"LegacySkeletonEntityModelAnimationMixin",
\t\t"LegacyPiglinEntityModelAnimationMixin",
\t\t"LegacyIllagerEntityModelAnimationMixin",
\t\t"LegacyPlayerEntityRendererBodyYawMixin",
\t\t"LegacyLivingEntityRendererBloodiedTextureMixin",
\t\t"LegacyArmorFeatureRendererBloodiedTextureMixin",
\t\t"LegacyLivingEntityRendererFirstPersonMixin",
\t\t"LegacyLivingEntityRendererMobPalBodyMixin",
\t\t"LegacyLivingEntityRendererGenericFeedbackMixin",
\t\t"LegacyLivingEntityRendererCollisionOnlyOutputMixin",
\t\t"LegacyWorldRendererFirstPersonCollisionMixin",
\t\t"LegacyBipedEntityModelHurtboxMixin",
\t\t"LegacyPlayerEntityModelPalHurtboxMixin",
\t\t"LegacyHeldItemFeatureRendererItemBoneMixin",
\t\t"LegacyHeldItemRendererHitboxMixin",
\t\t"LegacyItemRendererBloodiedTextureMixin",
\t\t"LegacyIllagerEntityRendererArmorMixin",
\t\t"ClientPlayerInteractionManagerMixin",''')
            filteredClientMixins = filteredClientMixins.replaceAll(',\\s*\\]', '\n\t]')
            clientMixins.setText(filteredClientMixins, 'UTF-8')
        }
        File cushioning = file("${destinationDir}/data/kingdom_come_combat/enchantment/cushioning.json")
        if (cushioning.exists()) {
            cushioning.setText(cushioning.getText('UTF-8')
                    .replace('minecraft:armor_toughness', 'minecraft:generic.armor_toughness'), 'UTF-8')
        }
        fileTree("${destinationDir}/data/kingdom_come_combat/recipe").matching {
            include '**/*.json'
        }.files.each { File recipe ->
            def json = new JsonSlurper().parse(recipe)
            if (json.key instanceof Map) {
                json.key.replaceAll { key, ingredient ->
                    if (!(ingredient instanceof String)) return ingredient
                    ingredient.startsWith('#')
                            ? [tag: ingredient.substring(1)]
                            : [item: ingredient]
                }
            }
            if (json.ingredients instanceof List) {
                json.ingredients = json.ingredients.collect { ingredient ->
                    if (!(ingredient instanceof String)) return ingredient
                    ingredient.startsWith('#')
                            ? [tag: ingredient.substring(1)]
                            : [item: ingredient]
                }
            }
            ['template', 'base', 'addition'].each { field ->
                def ingredient = json[field]
                if (ingredient instanceof String) {
                    json[field] = ingredient.startsWith('#')
                            ? [tag: ingredient.substring(1)]
                            : [item: ingredient]
                }
            }
            recipe.setText(JsonOutput.prettyPrint(JsonOutput.toJson(json)) + '\n', 'UTF-8')
        }
        File bulletModel = file("${destinationDir}/assets/kingdom_come_combat/models/item/bullet_with_gunpowder.json")
        if (bulletModel.exists()) {
            bulletModel.setText(bulletModel.getText('UTF-8')
                    .replace('"angle": 15', '"angle": 22.5')
                    .replace('"angle": -15', '"angle": -22.5'), 'UTF-8')
        }
        File poleaxeModel = file("${destinationDir}/assets/kingdom_come_combat/models/item/poleaxe.json")
        if (poleaxeModel.exists()) {
            poleaxeModel.setText(poleaxeModel.getText('UTF-8')
                    .replace('"angle": 20', '"angle": 22.5')
                    .replace('"angle": -20', '"angle": -22.5'), 'UTF-8')
        }
        ['heavy_bullet_with_gunpowder', 'buckshot_with_gunpowder'].each { ammoModel ->
            File legacyModel = file("${destinationDir}/assets/kingdom_come_combat/models/item/${ammoModel}.json")
            legacyModel.parentFile.mkdirs()
            legacyModel.setText('''{
  "parent": "kingdom_come_combat:item/bullet_with_gunpowder"
}
''', 'UTF-8')
        }
    }
}
