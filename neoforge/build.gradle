plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

version = project.mod_version
group = 'com.kingdomcomecombat'
base.archivesName = 'kingdom_come_combat-neoforge'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://repo.redlance.org/public' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.sinytra.org/' }
}

loom {
    silentMojangMappingsLicense()
    runs {
        client { client() }
        server { server() }
    }
}

sourceSets.main {
    java.srcDirs = [
            'build/generatedMojmap/main',
            'build/generatedMojmap/client',
            'build/generatedMojmap/legacy',
            'src/main/java'
    ]
    resources.srcDirs = ['../src/main/resources', '../src/client/resources', 'src/main/resources']
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // NeoForge patches introduce methods whose official names collide with
    // Yarn names. Compile the native module in Mojmap; prepareShared1211Sources
    // will be followed by a generated Yarn -> Mojmap source migration step.
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    modImplementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${forgified_fabric_api_version}"
    // FFAPI supplies this at runtime; expose its entrypoint/loader API to the
    // compiler without adding a second runtime module.
    compileOnly("org.sinytra:forgified-fabric-loader:${forgified_fabric_loader_version}") {
        transitive = false
    }
    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    // The 1.21.1 Neo jar already contains its Core classes; resolving the Core
    // POM transitively gives Loom duplicate inputs for every PAL core class.
    modImplementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}") {
        transitive = false
    }
    implementation('com.zigythebird:mochafloats:4.1.0') {
        transitive = false
    }
    modCompileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    implementation 'org.javassist:javassist:3.30.2-GA'
    forgeRuntimeLibrary 'org.javassist:javassist:3.30.2-GA'
}

tasks.register('prepareShared1211Sources', Exec) {
    workingDir '..'
    commandLine './gradlew', '-Ptarget_mc=1.21.1', 'generateVersionCompatSources', '--console=plain'
}

tasks.register('migrateSharedMainToMojmap', Exec) {
    dependsOn 'prepareShared1211Sources'
    workingDir '..'
    commandLine './gradlew', '-Ptarget_mc=1.21.1', 'migrateMappings',
            '--mappings', 'net.minecraft:mappings:1.21.1',
            '--input', 'build/generated/versionCompat/main',
            '--output', 'neoforge/build/generatedMojmap/main', '--console=plain'
}

tasks.register('migrateSharedClientToMojmap', Exec) {
    dependsOn 'migrateSharedMainToMojmap'
    workingDir '..'
    commandLine './gradlew', '-Ptarget_mc=1.21.1', 'migrateMappings',
            '--mappings', 'net.minecraft:mappings:1.21.1',
            '--input', 'build/generated/versionCompat/client',
            '--output', 'neoforge/build/generatedMojmap/client', '--console=plain'
}

tasks.register('migrateLegacyClientToMojmap', Exec) {
    dependsOn 'migrateSharedClientToMojmap'
    workingDir '..'
    commandLine './gradlew', '-Ptarget_mc=1.21.1', 'migrateMappings',
            '--mappings', 'net.minecraft:mappings:1.21.1',
            '--input', 'src/compat/legacy/java',
            '--output', 'neoforge/build/generatedMojmap/legacy', '--console=plain'
}

